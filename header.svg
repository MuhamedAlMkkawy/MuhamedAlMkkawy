<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Muhamed Al-Mkkawy, Fullstack Web Developer and AI Specialist, Riyadh, Saudi Arabia" xmlns:c2pa="http://c2pa.org/manifest">
<style>
:root{--bg:#eef1f5;--ink:#121821;--muted:#566174;--accent:#0b7a5e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1218;--ink:#e8edf3;--muted:#98a4b6;--accent:#3ddbb0}}
text{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.n{font-size:50px;font-weight:800;fill:var(--ink);letter-spacing:-1px}
.r{font-size:22px;font-weight:600;fill:var(--ink)}
.l{font-size:16px;fill:var(--muted)}
.bar{fill:var(--accent);transform-origin:50px 0;animation:grow 1s .1s cubic-bezier(.2,.7,.2,1) both}
.a{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.25s}.d2{animation-delay:.5s}.d3{animation-delay:.75s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}.bar{animation:none}}
</style>
<rect class="bg" width="900" height="230" rx="16"/>
<rect class="bar" x="50" y="48" width="64" height="5" rx="2.5"/>
<text class="a n d1" x="50" y="112">Muhamed Al-Mkkawy</text>
<text class="a r d2" x="50" y="152">Fullstack Web Developer &amp; AI Specialist</text>
<text class="a l d3" x="50" y="184">Node.js · NestJS · TypeScript · React/Next.js · Vue/Nuxt · Riyadh, Saudi Arabia</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
