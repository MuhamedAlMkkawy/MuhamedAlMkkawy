<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Muhamed Al-Mkkawy, Fullstack Web Developer and AI Specialist, Riyadh, Saudi Arabia" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b2a"/><stop offset=".6" stop-color="#0f2e3a"/><stop offset="1" stop-color="#0b4a45"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#3ddbb0" stop-opacity=".45"/><stop offset="1" stop-color="#3ddbb0" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#4f8cff" stop-opacity=".4"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient>
<linearGradient id="u" x1="0" x2="1"><stop offset="0" stop-color="#3ddbb0"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
<clipPath id="c"><rect width="900" height="260" rx="18"/></clipPath>
</defs>
<style>
text{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif}
.n{font-size:54px;font-weight:800;fill:#fff;letter-spacing:-1.2px}
.t{font-size:24px;font-weight:600;fill:#3ddbb0;opacity:0}
.s{font-size:15px;fill:#b7c4d4}
.a{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.2s}.d3{animation-delay:1s}
.t{animation:cycle 9s infinite}.t2{animation-delay:3s}.t3{animation-delay:6s}
.o1{animation:f1 14s ease-in-out infinite alternate}.o2{animation:f2 17s ease-in-out infinite alternate}
.bar{transform-origin:56px 0;animation:grow 1s .1s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes cycle{0%{opacity:0;transform:translateY(10px)}6%,28%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-10px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes f1{to{transform:translate(120px,40px)}}
@keyframes f2{to{transform:translate(-140px,-30px)}}
@media (prefers-reduced-motion:reduce){.a,.bar,.o1,.o2{animation:none;opacity:1}.t{animation:none}.t1{opacity:1}}
</style>
<g clip-path="url(#c)">
<rect width="900" height="260" fill="url(#g)"/>
<circle class="o1" cx="180" cy="60" r="190" fill="url(#b1)"/>
<circle class="o2" cx="760" cy="230" r="210" fill="url(#b2)"/>
</g>
<rect class="bar" x="56" y="46" width="72" height="5" rx="2.5" fill="url(#u)"/>
<text class="a n d1" x="56" y="116">Muhamed Al-Mkkawy</text>
<text class="t t1" x="56" y="160">Fullstack Web Developer</text>
<text class="t t2" x="56" y="160">AI Specialist</text>
<text class="t t3" x="56" y="160">API and SaaS Engineer</text>
<text class="a s d3" x="56" y="210">Node.js · NestJS · TypeScript · React/Next.js · Vue/Nuxt · MongoDB</text>
<text class="a s d3" x="56" y="232">Riyadh, Saudi Arabia</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
